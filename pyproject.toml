[project]
name = "pdf2md"
version = "0.1.0"
description = "Local, private PDF to clean Markdown (figures, tables, math). Bootstrap engine: Docling."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "docling>=2.0",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = ["slow: long-running conversion tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]
