<!doctype html>
<meta charset="utf8">
<title>pdf2md — WebGPU engine demo</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; max-width: 1100px; }
  h1 { font-size: 1.15rem; }
  #status { padding: .5rem .75rem; background: #f4f4f5; border-radius: 6px; white-space: pre-wrap; }
  .row { display: flex; gap: 1rem; margin-top: 1rem; align-items: flex-start; }
  .col { flex: 1; min-width: 0; }
  pre { background: #f8f8f8; border: 1px solid #eee; padding: .5rem; overflow: auto; max-height: 65vh; white-space: pre-wrap; word-break: break-word; }
  button { font: inherit; padding: .4rem .9rem; }
  img { max-width: 220px; display: block; margin: 4px 0; border: 1px solid #ddd; }
</style>
<body>
<h1>pdf2md — granite-docling-258M on WebGPU (real engine-js core)</h1>
<p>
  <button id="go">Convert page 1</button>
  <button id="goall">Convert full doc</button>
  of <code>sample.pdf</code>
</p>
<div id="status">loading…</div>
<div class="row">
  <div class="col"><h3>Markdown</h3><pre id="md"></pre></div>
  <div class="col"><h3>Figures</h3><div id="figs"></div></div>
</div>

<script type="module">
// Inject the platform libs; the engine core (engine.js) is version-agnostic.
import * as transformers from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";
import * as pdfjs from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
import { convertPdfBrowser } from "./engine.js";

pdfjs.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
transformers.env.allowLocalModels = false;

const statusEl = document.getElementById("status");
const setStatus = (s) => { statusEl.textContent = s; window.__status = s; };

async function convert(maxPages) {
  window.__done = false; window.__result = null;
  try {
    setStatus("loading model + converting (first run downloads ~1 GB) …");
    const data = new Uint8Array(await (await fetch("sample.pdf")).arrayBuffer());
    const t0 = performance.now();
    const doc = await convertPdfBrowser(
      { transformers, pdfjs, data },
      {
        maxPages,
        sourceLabel: "sample.pdf",
        titleFallback: "sample",
        vlm: {
          progressCallback: (p) => {
            if (p.status === "progress" && p.file?.includes("decoder"))
              setStatus(`downloading ${p.file} … ${Math.round(p.progress || 0)}%`);
          },
        },
      },
    );
    const ms = Math.round(performance.now() - t0);
    document.getElementById("md").textContent = doc.markdown;

    const figs = document.getElementById("figs");
    figs.innerHTML = "";
    let shown = 0;
    for (const f of doc.figures) {
      if (!f.png) continue;
      shown++;
      const img = new Image();
      img.src = URL.createObjectURL(new Blob([f.png], { type: "image/png" }));
      figs.appendChild(img);
    }
    window.__result = {
      title: doc.title, pages: doc.pageCount, processed: doc.pagesProcessed,
      figures: doc.figures.length, mdChars: doc.markdown.length,
      warnings: doc.warnings, ms,
    };
    setStatus(`done: "${doc.title}" — ${doc.pagesProcessed}/${doc.pageCount} pp, ${shown} figs, ${doc.markdown.length} chars, ${ms} ms. warnings: ${doc.warnings.length ? doc.warnings.join(" | ") : "none"}`);
  } catch (e) {
    window.__result = { error: String(e?.stack || e) };
    setStatus("ERROR: " + (e?.message || e));
  } finally {
    window.__done = true;
  }
}

document.getElementById("go").addEventListener("click", () => convert(1));
document.getElementById("goall").addEventListener("click", () => convert(0));
window.convert = convert;
setStatus("ready — Convert page 1 / full doc");
</script>
